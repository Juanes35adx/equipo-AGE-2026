# Evita que Supabase pause el proyecto en el plan gratis (se pausa tras días sin actividad).
# Todos los días llama a la función keepalive_ping(), que ESCRIBE la hora del ping en la
# tabla keepalive: eso es actividad real de la base. (Antes solo se leía `ubicaciones` con
# la llave anónima; RLS devolvía una lista vacía y Supabase no lo contó, el proyecto se
# pausó igual el 12/10/2026.) Si la base no responde, el workflow falla y GitHub envía
# un correo avisando.
# A partir de FECHA_FIN deja de hacer ping, y Supabase puede volver a pausar el proyecto.
name: Mantener Supabase activo

env:
  FECHA_FIN: "2026-12-01"

on:
  schedule:
    # Todos los días a las 13:00 UTC (8:00 a. m. en Colombia). GitHub suele retrasar
    # varias horas las ejecuciones programadas; correr a diario deja margen de sobra.
    - cron: "0 13 * * *"
  workflow_dispatch: # Permite correrlo a mano desde la pestaña Actions.

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Registrar actividad en la base de datos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ "$(date -u +%F)" \> "$FECHA_FIN" ] || [ "$(date -u +%F)" = "$FECHA_FIN" ]; then
            echo "Desde el $FECHA_FIN ya no se mantiene activo el proyecto. No se hace el ping."
            exit 0
          fi
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Faltan los secretos SUPABASE_URL o SUPABASE_ANON_KEY en el repositorio."
            exit 1
          fi
          # "|| true": si curl no logra conectarse (proyecto pausado), se informa abajo
          # en vez de cortar el script sin mensaje.
          respuesta=$(curl -s -w "\n%{http_code}" --max-time 30 -X POST \
            "$SUPABASE_URL/rest/v1/rpc/keepalive_ping" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}') || true
          codigo=$(printf '%s' "$respuesta" | tail -n 1)
          cuerpo=$(printf '%s' "$respuesta" | sed '$d')
          echo "Respuesta de Supabase: HTTP ${codigo:-sin conexión} · ${cuerpo}"
          if [ "$codigo" != "200" ]; then
            echo "La base no respondió bien. Puede estar pausada: reactívala desde el panel de Supabase."
            exit 1
          fi
          echo "Ping registrado en la tabla keepalive."
